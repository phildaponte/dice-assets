<!DOCTYPE html>
<html>
<head>
    <title>Dice Box Test</title>
</head>
<body>
    <div id="app">
        <h1>Dice Box Test</h1>
        <p>If you see this, the page has loaded.</p>
    </div>

    <script>
        console.log('Script starting...');

        // Function to load the dice bundle
        function loadDiceBundle() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'lib/dice-bundle.js';
                script.onload = () => {
                    console.log('Dice bundle loaded successfully');
                    // Log all properties defined on window after loading
                    const newProps = Object.keys(window).filter(key => 
                        !['self', 'document', 'name', 'location'].includes(key)
                    );
                    console.log('New window properties:', newProps);
                    resolve();
                };
                script.onerror = (error) => {
                    console.error('Error loading dice bundle:', error);
                    reject(error);
                };
                document.head.appendChild(script);
            });
        }

        async function initDiceBox() {
            try {
                console.log('Starting dice-box initialization...');
                
                // Create container
                const container = document.createElement('div');
                container.id = 'dice-box';
                container.style.cssText = `
                    width: 100%;
                    height: 300px;
                    position: relative;
                    background: #000000;
                `;
                document.getElementById('app').appendChild(container);
                console.log('Container created');

                // Store initial window properties
                const initialProps = new Set(Object.keys(window));
                
                // Load the dice bundle
                await loadDiceBundle();

                // Find new properties added to window
                const currentProps = new Set(Object.keys(window));
                const newProps = [...currentProps].filter(prop => !initialProps.has(prop));
                console.log('New properties after loading:', newProps);

                // Wait a moment for initialization
                await new Promise(resolve => setTimeout(resolve, 500));

                const config = {
                    element: '#dice-box',
                    assetPath: 'assets/',
                    theme: 'default',
                    scale: 6,
                    light: {
                        intensity: 1
                    }
                };
                
                console.log('Available constructors:', {
                    d: typeof d !== 'undefined' ? 'defined' : 'undefined',
                    A: typeof A !== 'undefined' ? 'defined' : 'undefined',
                    Q: typeof Q !== 'undefined' ? 'defined' : 'undefined',
                    DiceBox: typeof DiceBox !== 'undefined' ? 'defined' : 'undefined'
                });
                
                // Try to find the constructor
                const DiceConstructor = window.DiceBox || window.dice || window.Dice;
                if (!DiceConstructor) {
                    console.log('Bundle exports:', Object.keys(window));
                    throw new Error('Dice constructor not found. Available globals logged above.');
                }
                
                console.log('Creating DiceBox with config:', config);
                const box = new DiceConstructor(config);
                console.log('Box created:', box);

                // Try to roll the dice
                console.log('Attempting to roll dice...');
                const results = await box.roll('2d6');
                console.log('Roll results:', results);
                
            } catch (error) {
                console.error('Error in initialization:', error);
                console.log('Window object keys:', Object.keys(window));
            }
        }

        // Run the test when page loads
        window.addEventListener('load', initDiceBox);
        console.log('Load event listener added');
    </script>
</body>
</html>
