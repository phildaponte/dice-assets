<!DOCTYPE html>
<html>
<head>
    <title>Dice Box Test</title>
    <script src="lib/dice-bundle.js"></script>
</head>
<body>
    <div id="app"></div>
    <script>
        function initDiceBox() {
            console.log('Starting dice-box test...');
            
            // Create container
            const container = document.createElement('div');
            container.id = 'dice-box';
            container.style.cssText = `
                width: 100%;
                height: 300px;
                position: relative;
                background: #000000;
            `;
            document.getElementById('app').appendChild(container);

            try {
                // Log available exports
                console.log('Available exports:', window.DiceBox);
                
                // Create box with minimal config
                const config = {
                    element: '#dice-box',
                    assetPath: 'assets/',
                    theme: 'default',
                    scale: 6,
                    light: {
                        intensity: 1
                    }
                };
                
                console.log('Creating DiceBox with config:', config);
                
                // Try different ways to access DiceBox
                const BoxConstructor = window.DiceBox || window.dice.DiceBox || window.dice;
                if (!BoxConstructor) {
                    throw new Error('DiceBox constructor not found in global scope');
                }
                
                const box = new BoxConstructor(config);
                
                if (typeof box.roll === 'function') {
                    // Test roll directly if initialize is not available
                    box.roll('2d6').then(results => {
                        console.log('Roll results:', results);
                    }).catch(error => {
                        console.error('Roll error:', error);
                    });
                } else {
                    console.error('Roll method not found on box instance');
                    console.log('Available methods:', Object.keys(box));
                }
                
            } catch (error) {
                console.error('Error creating DiceBox:', error);
                console.log('Window object:', window);
            }
        }

        // Run the test when page loads
        window.addEventListener('load', initDiceBox);
    </script>
</body>
</html>
