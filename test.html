<!DOCTYPE html>
<html>
<head>
    <title>Dice Box Test</title>
    <script src="lib/dice-bundle.js"></script>
</head>
<body>
    <div id="app"></div>
    <script>
        function initDiceBox() {
            console.log('Starting dice-box test...');
            
            // Create container
            const container = document.createElement('div');
            container.id = 'dice-box';
            container.style.cssText = `
                width: 100%;
                height: 300px;
                position: relative;
                background: #000000;
            `;
            document.getElementById('app').appendChild(container);

            try {
                const config = {
                    element: '#dice-box',
                    assetPath: 'assets/',
                    theme: 'default',
                    scale: 6,
                    light: {
                        intensity: 1
                    }
                };
                
                // Use the Q constructor from the bundle
                if (typeof Q !== 'function') {
                    throw new Error('Q constructor not found. Available globals: ' + Object.keys(window).join(', '));
                }
                
                const box = new Q(config);
                
                // Wait a moment for initialization
                setTimeout(() => {
                    try {
                        box.roll('2d6');
                        console.log('Roll initiated');
                    } catch (rollError) {
                        console.error('Error during roll:', rollError);
                    }
                }, 1000);
                
            } catch (error) {
                console.error('Error creating DiceBox:', error);
            }
        }

        // Run the test when page loads
        window.addEventListener('load', initDiceBox);
    </script>
</body>
</html>
