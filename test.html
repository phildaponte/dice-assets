<!DOCTYPE html>
<html>
<head>
    <title>Dice Box Test</title>
</head>
<body>
    <div id="app">
        <h1>Dice Box Test</h1>
        <p>If you see this, the page has loaded.</p>
    </div>

    <script>
        console.log('Script starting...');

        // Function to load the dice bundle
        function loadDiceBundle() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'lib/dice-bundle.js';
                script.onload = () => {
                    console.log('Dice bundle loaded successfully');
                    resolve();
                };
                script.onerror = (error) => {
                    console.error('Error loading dice bundle:', error);
                    reject(error);
                };
                document.head.appendChild(script);
            });
        }

        async function initDiceBox() {
            try {
                console.log('Starting dice-box initialization...');
                
                // Create container
                const container = document.createElement('div');
                container.id = 'dice-box';
                container.style.cssText = `
                    width: 100%;
                    height: 300px;
                    position: relative;
                    background: #000000;
                `;
                document.getElementById('app').appendChild(container);
                console.log('Container created');

                // Load the dice bundle
                await loadDiceBundle();
                console.log('Bundle loaded, DiceBox available:', !!window.DiceBox);

                const config = {
                    element: '#dice-box',
                    assetPath: 'assets/',
                    theme: 'default',
                    scale: 6,
                    light: {
                        intensity: 1
                    }
                };
                
                console.log('Creating DiceBox with config:', config);
                
                // Create instance and store on window for debugging
                window.diceBoxInstance = new window.DiceBox(config);
                console.log('Box created:', window.diceBoxInstance);

                // Initialize the box
                console.log('Initializing box...');
                await window.diceBoxInstance.init();
                console.log('Box initialized');

                // Load the theme
                console.log('Loading theme...');
                await window.diceBoxInstance.loadTheme();
                console.log('Theme loaded');

                // Show the box
                console.log('Showing box...');
                window.diceBoxInstance.show();
                
                // Try to roll the dice
                console.log('Attempting to roll dice...');
                const results = await window.diceBoxInstance.roll('2d6');
                console.log('Roll results:', results);
                
            } catch (error) {
                console.error('Error in initialization:', error);
                if (window.diceBoxInstance) {
                    console.log('Box instance methods:', 
                        Object.getOwnPropertyNames(Object.getPrototypeOf(window.diceBoxInstance))
                    );
                }
            }
        }

        // Run the test when page loads
        window.addEventListener('load', initDiceBox);
        console.log('Load event listener added');
    </script>
</body>
</html>
