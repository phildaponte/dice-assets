<!DOCTYPE html>
<html>
<head>
    <title>Dice Box Test</title>
    <script src="lib/dice-bundle.js" type="module"></script>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        // Import the module
        import { DiceBox } from './lib/dice-bundle.js';
        
        async function initDiceBox() {
            console.log('Starting dice-box test...');
            
            // Create container
            const container = document.createElement('div');
            container.id = 'dice-box';
            container.style.cssText = `
                width: 100%;
                height: 300px;
                position: relative;
                background: #000000;
            `;
            document.getElementById('app').appendChild(container);

            try {
                const config = {
                    element: '#dice-box',
                    assetPath: 'assets/',
                    theme: 'default',
                    scale: 6,
                    light: {
                        intensity: 1
                    }
                };
                
                console.log('Creating DiceBox with config:', config);
                const box = new DiceBox(config);
                
                // Wait for the box to be ready
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                try {
                    console.log('Attempting to roll dice...');
                    const results = await box.roll('2d6');
                    console.log('Roll results:', results);
                } catch (rollError) {
                    console.error('Error during roll:', rollError);
                }
                
            } catch (error) {
                console.error('Error creating DiceBox:', error);
                console.log('Available exports:', Object.keys(window));
            }
        }

        // Run the test when page loads
        window.addEventListener('load', initDiceBox);
    </script>
</body>
</html>
