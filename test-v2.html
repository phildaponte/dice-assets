<!DOCTYPE html>
<html>
<head>
    <title>Dice Test v2</title>
    <!-- Required BabylonJS libraries -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <!-- Dice bundle -->
    <script src="lib/dice-bundle.js"></script>
    <style>
        #dice-box {
            width: 400px;
            height: 300px;
            background-color: black;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div id="dice-box"></div>

    <script>
        // Wait for everything to load
        window.addEventListener('load', async () => {
            console.log('Page loaded, checking DiceBox availability:', typeof DiceBox);
            console.log('DiceBox object:', DiceBox);

            try {
                // Initialize DiceBox
                console.log('Creating DiceBox instance...');
                const box = new DiceBox({
                    element: '#dice-box',
                    assetPath: 'assets/',
                    theme: 'default',
                    scale: 5,
                    onRollComplete: (results) => {
                        console.log('Roll complete! Results:', results);
                    }
                });

                console.log('DiceBox instance created:', box);
                console.log('Available methods on box:', Object.getOwnPropertyNames(box));
                console.log('Box prototype methods:', Object.getOwnPropertyNames(Object.getPrototypeOf(box)));

                // Wait for box to be ready
                try {
                    await box.initialize();
                    console.log('DiceBox initialized and ready');
                } catch (initError) {
                    console.error('Error during DiceBox initialization:', initError);
                    console.log('Initialization error details:', {
                        message: initError.message,
                        stack: initError.stack
                    });
                }

                // Roll 2d6
                console.log('Attempting to roll 2d6...');
                try {
                    const results = await box.roll('2d6');
                    console.log('Roll started, promise resolved with:', results);
                } catch (rollError) {
                    console.error('Error during roll:', rollError);
                    console.log('Roll error details:', {
                        message: rollError.message,
                        stack: rollError.stack
                    });
                }

            } catch (error) {
                console.error('Error in dice initialization:', error);
                console.log('Error details:', {
                    message: error.message,
                    stack: error.stack
                });
            }
        });
    </script>
</body>
</html>
