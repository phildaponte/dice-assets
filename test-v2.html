<!DOCTYPE html>
<html>
<head>
    <title>Dice Test v2</title>
    <!-- Required BabylonJS libraries -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        #dice-box {
            width: 400px;
            height: 300px;
            background-color: black;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div id="dice-box"></div>

    <script>
        // Function to load the dice bundle
        function loadDiceBundle() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'lib/dice-bundle.single.js';
                script.onload = () => {
                    console.log('Dice bundle loaded successfully');
                    resolve();
                };
                script.onerror = (error) => {
                    console.error('Error loading dice bundle:', error);
                    reject(error);
                };
                document.head.appendChild(script);
            });
        }

        // Wait for everything to load
        window.addEventListener('load', async () => {
            try {
                console.log('Page loaded, loading dice bundle...');
                await loadDiceBundle();
                console.log('DiceBox availability:', typeof window.DiceBox);

                // Initialize DiceBox
                console.log('Creating DiceBox instance...');
                const box = new window.DiceBox({
                    element: '#dice-box',
                    assetPath: 'assets/',
                    theme: 'default',
                    scale: 5,
                    onRollComplete: (results) => {
                        console.log('Roll complete! Results:', results);
                    }
                });

                console.log('DiceBox instance created:', box);

                try {
                    console.log('Calling init()...');
                    await box.init();
                    console.log('DiceBox initialized successfully');

                    // Roll 2d6
                    console.log('Attempting to roll 2d6...');
                    const results = await box.roll('2d6');
                    console.log('Roll started, promise resolved with:', results);

                } catch (initError) {
                    console.error('Error during DiceBox initialization:', initError);
                    console.log('Initialization error details:', {
                        name: initError.name,
                        message: initError.message,
                        stack: initError.stack
                    });
                }

            } catch (error) {
                console.error('Error in dice initialization:', error);
                console.log('Error details:', {
                    name: error.name,
                    message: error.message,
                    stack: error.stack
                });
            }
        });
    </script>
</body>
</html>
